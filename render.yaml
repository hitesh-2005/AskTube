services:
  - type: web
    name: asktube
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RELEVANCE_SCORE_THRESHOLD
        value: "0.52"
      - key: RETRIEVER_K
        value: "4"
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: MAX_ACTIVE_SESSIONS
        value: "2"
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
